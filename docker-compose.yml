# version: '3.8'  # Obsolète dans Docker Compose V2

services:
  bot-operateur:
    build: .
    image: bot-operateur:latest
    container_name: bot-operateur-112
    restart: unless-stopped
    
    # Configuration réseau
    network_mode: bridge
    
    # Variables d'environnement (à personnaliser)
    environment:
      # OBLIGATOIRE - Identifiants Opérateur 112
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
      
      # Configuration bot (avec valeurs par défaut)
      - DEFAULT_STRATEGY=${DEFAULT_STRATEGY:-smart}
      - HEADLESS=${HEADLESS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Seuils (configurables via .env)
      - MAX_CONCURRENT_MISSIONS=${MAX_CONCURRENT_MISSIONS:-3}
      - MIN_CREDITS_THRESHOLD=${MIN_CREDITS_THRESHOLD:-1000}
      - OPTIMIZATION_THRESHOLD=${OPTIMIZATION_THRESHOLD:-3}
      - DEPLOYMENT_THRESHOLD=${DEPLOYMENT_THRESHOLD:-5}
      - PERSONNEL_THRESHOLD=${PERSONNEL_THRESHOLD:-1}
      
      # Timeouts (configurables via .env)
      - PAGE_LOAD_TIMEOUT=${PAGE_LOAD_TIMEOUT:-30}
      - ELEMENT_WAIT_TIMEOUT=${ELEMENT_WAIT_TIMEOUT:-10}
      - FAST_TIMEOUT=${FAST_TIMEOUT:-5}
      - SLOW_TIMEOUT=${SLOW_TIMEOUT:-15}
      - BROWSER_SLOW_MO=${BROWSER_SLOW_MO:-100}
      
      # Retry et cooldown (configurables via .env)
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY=${RETRY_DELAY:-2}
      - MISSION_COOLDOWN=${MISSION_COOLDOWN:-5}
      
      # Monitoring (configurable via .env)
      - ENABLE_PERFORMANCE_LOGS=${ENABLE_PERFORMANCE_LOGS:-false}
      
      # Timezone pour logs (configurable via .env)
      - TZ=${TZ:-Europe/Paris}
    
    # Volumes pour persistance données
    volumes:
      # Logs persistants
      - ./data/logs:/app/logs:rw
      # Cache persistant 
      - ./data/cache:/app/cache:rw
      # Configuration personnalisée (optionnelle)
      - ./data/config:/app/config:ro
      # Données du bot
      - ./data/bot_data:/app/data:rw
    
    # Limits de ressources (augmentées pour meilleures performances)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'          # Augmenté de 1.0 à 2.0
        reservations:
          memory: 512M
          cpus: '1.0'          # Augmenté de 0.5 à 1.0
    
    # Healthcheck simple (sans port HTTP)
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Logging optimisé
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    
    # Sécurité - Pas d'options spéciales pour éviter les conflits sur QNAP
    # security_opt:
    #   - no-new-privileges:true
    
    # Labels pour organisation QNAP
    labels:
      - "com.qnap.application=bot-operateur-112"
      - "com.qnap.description=Bot automatisé Opérateur 112"
      - "com.qnap.version=1.0"
      - "com.qnap.category=automation"

  # Service de monitoring web avec API réelle
  monitoring:
    build: ./monitoring
    image: bot-monitoring:latest
    container_name: bot-monitoring
    restart: unless-stopped
    ports:
      - "${MONITORING_PORT:-8081}:80"  # Port configurable, défaut 8081
    volumes:
      - ./data/logs:/usr/share/nginx/html/logs:ro
      - ./bot_operateur/data:/usr/share/nginx/html/data:ro  # Accès aux données du bot (patterns non reconnus)
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Accès Docker pour stats
    depends_on:
      - bot-operateur
    labels:
      - "com.qnap.application=bot-monitoring"
      - "com.qnap.description=Interface de monitoring pour Bot Opérateur avec API réelle"

# Réseau personnalisé (optionnel)
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes nommés pour facilité de gestion QNAP
volumes:
  bot_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/logs
  bot_cache:
    driver: local
    driver_opts:
      type: none  
      o: bind
      device: ${PWD}/data/cache