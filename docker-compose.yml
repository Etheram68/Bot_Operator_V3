# version: '3.8'  # Obsolète dans Docker Compose V2

services:
  bot-operateur:
    build: .
    image: bot-operateur:latest
    container_name: bot-operateur-112
    restart: unless-stopped
    shm_size: '512mb'

    # Variables chargées depuis .env
    env_file:
      - .env

    environment:
      - TZ=${TZ:-Europe/Paris}
    
    # Volumes pour persistance données
    volumes:
      # Données JSON persistantes (patterns, véhicules)
      - ./bot_operateur/data:/app/bot_operateur/data:rw
      # Logs persistants
      - ./data/logs:/app/logs:rw
      # Cache navigateur persistant
      - ./data/cache:/app/cache:rw
    
    # Limits de ressources (augmentées pour meilleures performances)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'          # Augmenté de 1.0 à 2.0
        reservations:
          memory: 512M
          cpus: '1.0'          # Augmenté de 0.5 à 1.0
    
    # Healthcheck: vérifie que le bot écrit des logs récemment
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging optimisé
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    
    # Sécurité - Pas d'options spéciales pour éviter les conflits sur QNAP
    # security_opt:
    #   - no-new-privileges:true
    
    # Labels pour organisation QNAP
    labels:
      - "com.qnap.application=bot-operateur-112"
      - "com.qnap.description=Bot automatisé Opérateur 112"
      - "com.qnap.version=1.0"
      - "com.qnap.category=automation"

  # Service de monitoring web avec API réelle
  monitoring:
    build: ./monitoring
    image: bot-monitoring:latest
    container_name: bot-monitoring
    restart: unless-stopped
    ports:
      - "${MONITORING_PORT:-8081}:80"  # Port configurable, défaut 8081
    volumes:
      - ./data/logs:/usr/share/nginx/html/logs:ro
      - ./bot_operateur/data:/usr/share/nginx/html/data:ro  # Accès aux données du bot (patterns non reconnus)
      - ./data/monitoring-api:/usr/share/nginx/html/api:rw  # API data persistante
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Accès Docker pour stats
    depends_on:
      - bot-operateur
    labels:
      - "com.qnap.application=bot-monitoring"
      - "com.qnap.description=Interface de monitoring pour Bot Opérateur avec API réelle"

# Réseau personnalisé pour isolation
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16