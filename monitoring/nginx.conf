events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Page d'accueil - dashboard de monitoring
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Autres fichiers statiques
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Navigation des logs
        location /logs/ {
            alias /usr/share/nginx/html/logs/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        # API de statut simple
        location /status {
            return 200 '{"status":"ok","bot":"running","timestamp":"$time_iso8601","server":"nginx"}';
            add_header Content-Type application/json;
        }

        # API container réelle - stats
        location /api/container/stats {
            alias /usr/share/nginx/html/api/;
            try_files /stats.json @container_stats_fallback;
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location @container_stats_fallback {
            return 200 '{"status":"error","error":"Container stats not available","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # API container réelle - logs
        location /api/container/logs {
            alias /usr/share/nginx/html/api/;
            try_files /logs.txt @container_logs_fallback;
            add_header Content-Type text/plain;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location @container_logs_fallback {
            return 200 'Container logs not available';
            add_header Content-Type text/plain;
        }

        # API statistiques du bot
        location /api/bot/stats {
            alias /usr/share/nginx/html/api/;
            try_files /bot-stats.json @bot_stats_fallback;
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location @bot_stats_fallback {
            return 200 '{"status":"error","error":"Stats not available"}';
            add_header Content-Type application/json;
        }

        # API missions actives
        location /api/bot/active-missions {
            alias /usr/share/nginx/html/api/;
            try_files /active-missions.json @active_missions_fallback;
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location @active_missions_fallback {
            return 200 '{"status":"error","error":"No active missions","missions":[]}';
            add_header Content-Type application/json;
        }

        # API pour les labels non reconnus (centralisé dans unmatched_labels.jsonl)
        location /api/unmatched-labels {
            alias /usr/share/nginx/html/;
            try_files /data/unmatched_labels.jsonl @unmatched_fallback;
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Rétro-compatibilité ancien endpoint
        location /api/unrecognized-patterns {
            alias /usr/share/nginx/html/;
            try_files /data/unmatched_labels.jsonl @unmatched_fallback;
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location @unmatched_fallback {
            return 200 '[]';
            add_header Content-Type application/json;
        }

        # API pour remettre à zéro les labels non reconnus
        # docker exec bot-monitoring /usr/local/bin/reset-patterns.sh
        location /api/unmatched-labels/reset {
            return 200 '{"success":true,"message":"Pour réinitialiser, exécutez: docker exec bot-monitoring /usr/local/bin/reset-patterns.sh"}';
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API pour les actions Docker (proxy vers Flask)
        location /api/container/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts pour les actions longues
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Pas de cache pour les API
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
